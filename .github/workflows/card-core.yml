name: card-core

on:
  push:
    branches: [main]
    paths:
      - "card-core/**"
      - ".github/workflows/card-core.yml"
      - ".github/workflows/card-core-rust-mutants.yml"
  pull_request:
    paths:
      - "card-core/**"
      - ".github/workflows/card-core.yml"
      - ".github/workflows/card-core-rust-mutants.yml"

jobs:
  conformance:
    name: Conformance (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: card-core/requirements.txt

      - name: Install dependencies
        run: pip install -r card-core/requirements.txt

      - name: Check shell scripts parse
        run: |
          bash -n card-core/tools/digest.sh
          bash -n card-core/tools/setup-toolchain.sh

      - name: Run conformance suite
        run: python card-core/tools/run_conformance.py

      - name: Prove the suite has teeth
        run: python card-core/tools/run_conformance.py --selftest

      - name: Run pytest wrapper
        run: python -m pytest card-core/tests -q

  rust:
    name: Conformance (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-core/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            card-core/rust/target
          key: card-core-rust-${{ runner.os }}-${{ hashFiles('card-core/rust/Cargo.lock') }}
          restore-keys: card-core-rust-${{ runner.os }}-

      - name: Setup Python (hosts the conformance harness)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: card-core/requirements.txt

      - name: Install harness dependencies
        working-directory: .
        run: pip install -r card-core/requirements.txt

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run conformance suite against the Rust binary
        working-directory: .
        run: python card-core/tools/run_conformance.py --impl-cmd "card-core/rust/target/release/cardcore protocol"

      - name: Protocol UX/security pytest against the Rust binary
        working-directory: .
        env:
          CARD_CORE_RUST_BIN: ${{ github.workspace }}/card-core/rust/target/release/cardcore
        run: python -m pytest card-core/tests/test_protocol_ux_security_pr31.py -q
