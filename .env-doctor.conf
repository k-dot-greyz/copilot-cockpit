# .env-doctor.conf
# Environment Doctor configuration for copilot-cockpit (zenOS / GlitchWorks)

BRAND="copilot-cockpit"
ENV_DOCTOR_HELP_URL="https://github.com/k-dot-greyz/copilot-cockpit"

# Node is the primary runtime for Astro + React + TypeScript static dashboard
ENV_DOCTOR_MIN_NODE_VERSION="22.12.0"

# Python 3.14+ is mandatory before any Python tooling runs (see scripts/ensure-python314.sh)
ENV_DOCTOR_MIN_PYTHON_MINOR="14"
ENV_DOCTOR_PYTHON_PIN="3.14"
ENV_DOCTOR_BOOT_AUDIT="true"
ENV_DOCTOR_PERSIST_PATH="true"

# Submodule scan includes vendored env-doctor
ENV_DOCTOR_WITH_SUBMODULES="true"
ENV_DOCTOR_CORE_REPOS="vendor/env-doctor"
