[package]
name = "cardcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Card Core v1 conformance target (Rust): lint, validate, resolve, freshness and adapt over the stdin/stdout JSON protocol"
publish = false

[lib]
name = "cardcore"
path = "src/lib.rs"

[[bin]]
name = "cardcore"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
jsonschema = { version = "0.58.5", default-features = false }
sha2 = "0.11.0"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
